<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="mock.css">
<style>
.row1 { position:absolute; left:12px; right:12px; top:62px; display:flex; gap:8px; }
.dd { flex:1; height:38px; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(20,30,50,.12); display:flex; align-items:center; padding:0 12px; font-size:13.5px; font-weight:600; gap:6px; }
.dd .c { margin-left:auto; color:var(--ink-3); font-size:11px; }
.seg { display:flex; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(20,30,50,.12); overflow:hidden; height:38px; }
.seg span { padding:0 9px; display:flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; border-left:1px solid var(--line); color:var(--ink-3); }
.seg span:first-child { border-left:0; }
.seg span.on { color:var(--ink); background:#f3f7ff; }
.seg .dot { width:8px; height:8px; }
.seg span:not(.on) .dot { opacity:.3; }
.row2 { position:absolute; left:0; right:0; top:108px; display:flex; gap:6px; padding:0 12px; overflow:hidden; }
.row2 .chip { height:30px; font-size:12.5px; font-weight:500; }
</style></head><body><div class="phone"><div class="map"></div>
<div class="topbar"><div class="search"><i></i>団地名・駅・住所</div><div class="rbtn">📅</div><div class="rbtn">⋯</div></div>
<div class="row1">
  <div class="dd">📍 東京・神奈川 <span class="c">▾</span></div>
  <div class="seg"><span class="on"><i class="dot" style="--d:var(--toei)"></i>都営</span><span class="on"><i class="dot" style="--d:var(--ken)"></i>県営</span><span><i class="dot" style="--d:var(--shi)"></i>市営</span><span><i class="dot" style="--d:var(--ur)"></i>UR</span></div>
</div>
<div class="row2"><span class="chip on">募集中</span><span class="chip">家賃 ▾</span><span class="chip">間取り ▾</span><span class="chip">築年 ▾</span><span class="chip">単身可</span><span class="chip">もっと</span></div>
<div class="note-tip" style="left:14px;top:150px">「地域」と「運営元」は特別扱いにして、1段目に常に出す案。地域はプルダウン（都県→市区のチェック）。運営元は4つの色付きスイッチで、押すたびにON/OFF。2段目に家賃などの条件</div>
<div class="fab">◎</div>
<div class="drawer"><div class="handle"></div><div class="count">1,041件<small>募集中</small><span class="sort">家賃が安い順 ▾</span></div>
<div class="item"><b>高島平二丁目</b><span class="rent">¥12,300〜</span><span class="sub"><span class="tag" style="--d:var(--toei)">都営</span>2DK 45㎡・高島平駅8分・前回3.2倍</span></div>
<div class="item"><b>川崎河原町</b><span class="rent">¥16,100〜</span><span class="sub"><span class="tag" style="--d:var(--ken)">県営</span>3DK 50㎡・川崎駅バス10分</span></div></div>
</div></body></html>

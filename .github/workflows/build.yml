name: 自動取得（週2回、データを作り直して公開）

on:
  schedule:
    - cron: "0 21 * * 0,3"   # 月・木 06:00 JST（オーナー指示：3日〜週1で十分）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  TZ: Asia/Tokyo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - name: 取得したPDF・HTMLのキャッシュ（同じファイルを取り直さないため。URの団地ページ約700枚など）
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: データを作り直す
        id: build
        run: |
          set +e
          python scripts/build_all.py
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          [ -f data/build_report.md ] && cat data/build_report.md
          # 1（例外で止まった）はワークフローを失敗にする。2（一部の運営元が失敗・前回値を残した）は続ける
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi
      - name: 変わっていれば push（通知より先に公開する）
        id: push
        run: |
          git config user.name "koei-map bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data/listings.json data/rounds.json data/build_report.md data/geocode_cache.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "変更なし"; else
            git commit -m "自動更新 $(date +%Y-%m-%d)"
            git status --short | head -20
            git pull --rebase --autostash origin main
            git push
          fi

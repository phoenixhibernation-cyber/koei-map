name: 毎日の自動取得（データを作り直して公開）

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  TZ: Asia/Tokyo
  LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - name: データを作り直す
        id: build
        run: |
          set +e
          python scripts/build_all.py
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          [ -f data/build_report.md ] && cat data/build_report.md
          # 1（例外で止まった）はワークフローを失敗にする。2（一部の運営元が失敗・前回値を残した）は続ける
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi
      - name: 変わっていれば push（通知より先に公開する）
        id: push
        run: |
          git config user.name "koei-map bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data/listings.json data/rounds.json data/build_report.md data/geocode_cache.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "変更なし"; else
            git commit -m "自動更新 $(date +%Y-%m-%d)"
            git status --short | head -20
            git pull --rebase --autostash origin main
            git push
          fi
      - name: 新しい募集があれば LINE で知らせる（トークンがあるときだけ）
        if: ${{ env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        run: |
          python scripts/notify_line.py
          if [ -f data/notified.json ]; then
            git add data/notified.json
            git diff --cached --quiet || (git commit -m "通知の記録 $(date +%Y-%m-%d)" && git pull --rebase --autostash origin main && git push)
          fi
      - name: 読み取りに失敗した運営元があれば知らせる（Issue。開いているものがあればコメント）
        if: ${{ always() && steps.build.outputs.exit != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('data/build_report.md') ? fs.readFileSync('data/build_report.md', 'utf8') : '（レポートなし。例外で止まった可能性）';
            const title = '自動取得で失敗した運営元があります';
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'auto-build' });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['auto-build'] });
            }

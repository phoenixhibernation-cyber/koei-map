<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サムネ比較</title>
<style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:0;padding:24px 16px 120px;background:#f6f8fb;color:#202124}h1{font-size:20px;margin:0 0 4px}p.lead{color:#5f6368;font-size:14px;margin:0 0 20px}
section{background:#fff;border-radius:14px;padding:16px;margin:0 0 18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
label{display:block;border:2px solid #e3e6ea;border-radius:12px;overflow:hidden;cursor:pointer;background:#fff}label:has(input:checked){border-color:#e53935;box-shadow:0 0 0 3px #fde3e2}
label img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}label .cap{display:flex;gap:6px;align-items:center;padding:8px 10px;font-size:13px}label .cap b{font-size:14px}
.card{width:100%;aspect-ratio:330/92;object-fit:cover}.small{display:block;font-size:11px;color:#5f6368;padding:0 10px 8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3e6ea;padding:12px 16px;display:flex;gap:12px;align-items:center}
.bar button{background:#e53935;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700}.bar span{font-size:13px;color:#5f6368}</style></head><body>
<h1>提携カードのサムネ比較</h1><p class="lead">テーマごとに1つ選んでください（「今」はいまサイトに出ている絵）。下はカードでの見え方（上下が切れます）。選び終わったら下の赤いボタンを押して、チャットに貼ってください。</p><section><h2>引っ越し見積もり</h2><div class="grid"><label><img src="../../img/aff/move.webp" alt=""><span class="cap"><input type="radio" name="move" value="今のまま" checked><b>今</b>のまま</span><img class="card" src="../../img/aff/move.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="move-a.webp" alt=""><span class="cap"><input type="radio" name="move" value="A"><b>A</b> 赤い段ボール</span><img class="card" src="move-a.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="move-b.webp" alt=""><span class="cap"><input type="radio" name="move" value="B"><b>B</b> 赤い丸に白い￥</span><img class="card" src="move-b.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="move-c.webp" alt=""><span class="cap"><input type="radio" name="move" value="C"><b>C</b> ￥入りの赤い段ボール</span><img class="card" src="move-c.webp" alt=""><span class="small">カードでの見え方</span></label></div></section><section><h2>ネット回線</h2><div class="grid"><label><img src="../../img/aff/net.webp" alt=""><span class="cap"><input type="radio" name="net" value="今のまま" checked><b>今</b>のまま</span><img class="card" src="../../img/aff/net.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="net-a.webp" alt=""><span class="cap"><input type="radio" name="net" value="A"><b>A</b> 赤い電波マーク</span><img class="card" src="net-a.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="net-b.webp" alt=""><span class="cap"><input type="radio" name="net" value="B"><b>B</b> ルーターから赤い電波</span><img class="card" src="net-b.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="net-c.webp" alt=""><span class="cap"><input type="radio" name="net" value="C"><b>C</b> 赤い丸に白いWi-Fi</span><img class="card" src="net-c.webp" alt=""><span class="small">カードでの見え方</span></label></div></section><section><h2>電気・ガス</h2><div class="grid"><label><img src="../../img/aff/power.webp" alt=""><span class="cap"><input type="radio" name="power" value="今のまま" checked><b>今</b>のまま</span><img class="card" src="../../img/aff/power.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="power-a.webp" alt=""><span class="cap"><input type="radio" name="power" value="A"><b>A</b> 赤い炎と稲妻</span><img class="card" src="power-a.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="power-b.webp" alt=""><span class="cap"><input type="radio" name="power" value="B"><b>B</b> 赤い丸に白い稲妻と炎</span><img class="card" src="power-b.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="power-c.webp" alt=""><span class="cap"><input type="radio" name="power" value="C"><b>C</b> 赤い炎と赤い電球</span><img class="card" src="power-c.webp" alt=""><span class="small">カードでの見え方</span></label></div></section><section><h2>UR賃貸（すぐ入れる団地）</h2><div class="grid"><label><img src="../../img/aff/ur.webp" alt=""><span class="cap"><input type="radio" name="ur" value="今のまま" checked><b>今</b>のまま</span><img class="card" src="../../img/aff/ur.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="ur-a.webp" alt=""><span class="cap"><input type="radio" name="ur" value="A"><b>A</b> 赤い鍵</span><img class="card" src="ur-a.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="ur-b.webp" alt=""><span class="cap"><input type="radio" name="ur" value="B"><b>B</b> 赤い丸に白い鍵</span><img class="card" src="ur-b.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="ur-c.webp" alt=""><span class="cap"><input type="radio" name="ur" value="C"><b>C</b> 赤い鍵と虫めがね</span><img class="card" src="ur-c.webp" alt=""><span class="small">カードでの見え方</span></label></div></section><section><h2>家賃の安い賃貸</h2><div class="grid"><label><img src="../../img/aff/rent.webp" alt=""><span class="cap"><input type="radio" name="rent" value="今のまま" checked><b>今</b>のまま</span><img class="card" src="../../img/aff/rent.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="rent-a.webp" alt=""><span class="cap"><input type="radio" name="rent" value="A"><b>A</b> 赤いマップピン</span><img class="card" src="rent-a.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="rent-b.webp" alt=""><span class="cap"><input type="radio" name="rent" value="B"><b>B</b> 赤い虫めがね</span><img class="card" src="rent-b.webp" alt=""><span class="small">カードでの見え方</span></label><label><img src="rent-c.webp" alt=""><span class="cap"><input type="radio" name="rent" value="C"><b>C</b> 赤い丸にピンと虫めがね</span><img class="card" src="rent-c.webp" alt=""><span class="small">カードでの見え方</span></label></div></section><div class="bar"><button id="copy">決定をコピー</button><span id="msg">各テーマで1つずつ選べます</span></div>
<script>const names={move:"引っ越し",net:"ネット回線",power:"電気・ガス",ur:"UR",rent:"賃貸"};
document.getElementById("copy").onclick=async()=>{const t="サムネの決定："+Object.keys(names).map(k=>names[k]+"="+document.querySelector(`input[name=${k}]:checked`).value).join("、");try{await navigator.clipboard.writeText(t);document.getElementById("msg").textContent="コピーしました："+t}catch(e){prompt("コピーしてください",t)}};</script></body></html>
